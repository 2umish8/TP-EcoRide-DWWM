services:
    server:
        build: .
        environment:
            NODE_ENV: production
            # Use external DBaaS: set these environment variables in your deployment
            # Example values (replace with your DBaaS connection strings):
            # MONGODB_URI: mongodb+srv://user:pass@cluster.mongodb.net/ecoride_db
            # DATABASE_URL: mysql://user:pass@host:3306/ecoride_db
        ports:
            - 3000:3000
        depends_on:
            mysql:
                condition: service_started
            mongodb:
                condition: service_healthy

    # Local DB services removed. Use external DBaaS and set connection strings via environment variables.
