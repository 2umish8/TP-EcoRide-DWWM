# EcoRide - Complete Application Stack
# Docker Compose configuration for frontend and backend (databases external)

services:
    # Frontend service - Vue.js application served by nginx
    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        container_name: ecoride-frontend
        ports:
            - "80:80"
            - "443:443"
        environment:
            - NODE_ENV=production
        depends_on:
            - backend
        networks:
            - ecoride-network
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.rule=Host(`localhost`)"

    # Backend service - Node.js/Express API server
    backend:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        container_name: ecoride-backend
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            # Database connections - use external DBaaS via environment variables
            # Example: DATABASE_URL=mysql://user:pass@host:3306/ecoride_db
            #          MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/ecoride_db
            # Security
            - JWT_SECRET=ecoride-super-secret-jwt-key-2025-production
            - JWT_EXPIRATION=24h
            - BCRYPT_SALT_ROUNDS=12
            # CORS
            - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
        # backend should be started after frontend build but external DBs are provided
        networks:
            - ecoride-network
        restart: unless-stopped
        volumes:
            - backend-logs:/usr/src/app/logs
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # Note: Database services (MySQL, MongoDB, Redis) and admin tools were removed
    # from this compose file. Provide external DB connection strings via env vars.

# Networks configuration
networks:
    ecoride-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16

# Volumes for data persistence
volumes:
    # DB volumes removed - external DBaaS is used instead
    backend-logs:
        driver: local
