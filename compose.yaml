# EcoRide - Complete Application Stack
# Docker Compose configuration for frontend, backend, and databases
version: "3.8"

services:
    # Frontend service - Vue.js application served by nginx
    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        container_name: ecoride-frontend
        ports:
            - "80:80"
            - "443:443"
        environment:
            - NODE_ENV=production
        depends_on:
            - backend
        networks:
            - ecoride-network
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.rule=Host(`localhost`)"

    # Backend service - Node.js/Express API server
    backend:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        container_name: ecoride-backend
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            # Database connections
            - DATABASE_URL=mysql://ecoride_user:9vT!e2QpLx7R@mysql:3306/ecoride_db
            - MONGODB_URI=mongodb://admin:7gX%21p2QzLm9R@mongodb:27017/ecoride_db?authSource=admin
            # Security
            - JWT_SECRET=ecoride-super-secret-jwt-key-2025-production
            - JWT_EXPIRATION=24h
            - BCRYPT_SALT_ROUNDS=12
            # CORS
            - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
        depends_on:
            mysql:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        networks:
            - ecoride-network
        restart: unless-stopped
        volumes:
            - backend-logs:/usr/src/app/logs
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # MySQL database - Primary relational database
    mysql:
        image: mysql:8.0
        container_name: ecoride-mysql
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=s8Qw3z!pLk2V
            - MYSQL_DATABASE=ecoride_db
            - MYSQL_USER=ecoride_user
            - MYSQL_PASSWORD=9vT!e2QpLx7R
            - MYSQL_CHARSET=utf8mb4
            - MYSQL_COLLATION=utf8mb4_unicode_ci
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
            - ./Backend/Database:/docker-entrypoint-initdb.d:ro
        networks:
            - ecoride-network
        command: --default-authentication-plugin=mysql_native_password
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "ecoride_user",
                    "-p9vT!e2QpLx7R",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # MongoDB database - Document database for reviews and preferences
    mongodb:
        image: mongo:7.0
        container_name: ecoride-mongodb
        restart: unless-stopped
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=7gX!p2QzLm9R
            - MONGO_INITDB_DATABASE=ecoride_db
        ports:
            - "27017:27017"
        volumes:
            - mongodb-data:/data/db
            - mongodb-config:/data/configdb
        networks:
            - ecoride-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mongosh --username admin --password ''7gX!p2QzLm9R'' --authenticationDatabase admin --eval ''db.adminCommand("ping")'' --quiet || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 8
            start_period: 30s

    # Redis cache (optional) - For session management and caching
    redis:
        image: redis:7-alpine
        container_name: ecoride-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        networks:
            - ecoride-network
        command: redis-server --appendonly yes --requirepass "ecoride-redis-2025"
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "ecoride-redis-2025", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

    # Adminer - Database administration tool (development only)
    adminer:
        image: adminer:latest
        container_name: ecoride-adminer
        restart: unless-stopped
        ports:
            - "8080:8080"
        networks:
            - ecoride-network
        environment:
            - ADMINER_DEFAULT_SERVER=mysql
            - ADMINER_DESIGN=pepa-linha
        profiles:
            - development

    # Mongo Express - MongoDB administration tool (development only)
    mongo-express:
        image: mongo-express:latest
        container_name: ecoride-mongo-express
        restart: unless-stopped
        ports:
            - "8081:8081"
        environment:
            - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
            - ME_CONFIG_MONGODB_ADMINPASSWORD=7gX!p2QzLm9R
            - ME_CONFIG_MONGODB_SERVER=mongodb
            - ME_CONFIG_BASICAUTH_USERNAME=admin
            - ME_CONFIG_BASICAUTH_PASSWORD=admin
        depends_on:
            - mongodb
        networks:
            - ecoride-network
        profiles:
            - development

# Networks configuration
networks:
    ecoride-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16

# Volumes for data persistence
volumes:
    mysql-data:
        driver: local
    mongodb-data:
        driver: local
    mongodb-config:
        driver: local
    redis-data:
        driver: local
    backend-logs:
        driver: local
